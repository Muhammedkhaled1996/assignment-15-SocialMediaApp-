$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/auth/sessions/:sessionId"
  method: DELETE
  headers:
    - key: Accept
      value: application/json
    - key: x-branch-id
      value: "{{branchId}}"
      description: Active branch context override (validated against user's allowedBranchIds)
  pathVariables:
    - key: sessionId
      value: "{{sessionId}}"
      description: MongoDB ObjectId of the UserSession
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": true,
        "message": "Operation completed",
        "status": 200,
        "data": {
          "revoked": true,
          "sessionId": "6733b0a1e4b0a1a2b3c4d5e6"
        },
        "meta": {}
      }
order: 1000
