$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/auth/logout"
  method: POST
  headers:
    - key: Accept
      value: application/json
    - key: x-branch-id
      value: "{{branchId}}"
      description: Active branch context override (validated against user's allowedBranchIds)
    - key: Content-Type
      value: application/json
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": true,
        "message": "Operation completed",
        "status": 200,
        "meta": {}
      }
order: 1000
