$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/auth/signup"
  method: POST
  headers:
    - key: Accept
      value: application/json
    - key: x-branch-id
      value: "{{branchId}}"
      description: Active branch context override (validated against user's allowedBranchIds)
    - key: Content-Type
      value: application/json
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": true,
        "message": "Operation completed",
        "status": 201,
        "data": {
          "message": "User registered successfully. Please confirm your email."
        },
        "meta": {}
      }
order: 1000
