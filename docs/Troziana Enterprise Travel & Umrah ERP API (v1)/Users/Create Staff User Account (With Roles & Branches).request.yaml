$kind: http-request
description: |-
  Creates an active staff user, assigns branches, and binds initial roles

  - **Required Permission:** `users.create`
  - **Branch Scoped:** `false`
url: "{{baseUrl}}/api/v1/users/staff"
method: POST
headers:
  - key: Accept
    value: application/json
  - key: x-branch-id
    value: "{{branchId}}"
    description: Active branch context override (validated against user's allowedBranchIds)
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "firstName": "Ahmed",
      "lastName": "Cairo",
      "email": "cairo@troziana.com",
      "password": "Password123!",
      "phone": "01012345678",
      "gender": 0,
      "primaryBranchId": "{{branchId}}",
      "assignedBranchIds": [
        "{{branchId}}"
      ],
      "canAccessAllBranches": false,
      "roleIds": [
        "{{roleId}}"
      ],
      "jobTitle": "Branch Manager",
      "employeeCode": "EMP-001"
    }
auth:
  type: bearer
  credentials:
    token: "{{accessToken}}"
scripts:
  - type: beforeRequest
    code: |-
      // Auto-generate fresh Idempotency-Key for safe retry testing
      pm.collectionVariables.set('idempotencyKey', 'idem-' + Date.now() + '-' + Math.floor(Math.random() * 100000));
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Expected HTTP status 201", function () {
        pm.response.to.have.status(201);
      });
      pm.test("Response has standard JSON structure", function () {
        if (pm.response.headers.get("Content-Type") && pm.response.headers.get("Content-Type").includes("application/json")) {
          const body = pm.response.json();
          pm.expect(body).to.be.an("object");
          if (body.success !== undefined) pm.expect(body.success).to.equal(true);
        }
      });
    language: text/javascript
order: 2000
