$kind: http-request
description: |-
  Registers an external B2B partner tourism company

  - **Required Permission:** `wholesale.manage`
  - **Branch Scoped:** `false`
url: "{{baseUrl}}/api/v1/wholesale/partners"
method: POST
headers:
  - key: Accept
    value: application/json
  - key: x-branch-id
    value: "{{branchId}}"
    description: Active branch context override (validated against user's allowedBranchIds)
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "code": "AGN-NILE-01",
      "companyNameAr": "شركة النيل للسياحة الدينية",
      "companyNameEn": "Nile Religious Tourism Co.",
      "tourismLicenseNumber": "LIC-2244",
      "taxNumber": "412-889-100",
      "contactPerson": "Hossam El-Din",
      "phone": "01223344556",
      "email": "b2b@niletourism.com",
      "address": "Downtown Cairo"
    }
auth:
  type: bearer
  credentials:
    token: "{{accessToken}}"
scripts:
  - type: beforeRequest
    code: |-
      // Auto-generate fresh Idempotency-Key for safe retry testing
      pm.collectionVariables.set('idempotencyKey', 'idem-' + Date.now() + '-' + Math.floor(Math.random() * 100000));
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Status code is 201', function () { pm.response.to.have.status(201); });
      const json = pm.response.json();
      if (json.data && json.data._id) pm.collectionVariables.set('partnerId', json.data._id);
    language: text/javascript
order: 2000
