$kind: http-request
description: |-
  Allocates a seat block from a trip to a B2B partner agency and tracks wholesale receivables

  - **Required Permission:** `wholesale.manage`
  - **Branch Scoped:** `true`
url: "{{baseUrl}}/api/v1/wholesale/contracts"
method: POST
headers:
  - key: Accept
    value: application/json
  - key: x-branch-id
    value: "{{branchId}}"
    description: Active branch context override (validated against user's allowedBranchIds)
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "partnerId": "{{partnerId}}",
      "tripId": "{{tripId}}",
      "branchId": "{{branchId}}",
      "allocationType": "SEAT_BLOCK",
      "seatQuantity": 5,
      "unitPriceEgp": 56000,
      "depositAmountEgp": 50000,
      "notes": "B2B block of 5 quad seats"
    }
auth:
  type: bearer
  credentials:
    token: "{{accessToken}}"
scripts:
  - type: beforeRequest
    code: |-
      // Auto-generate fresh Idempotency-Key for safe retry testing
      pm.collectionVariables.set('idempotencyKey', 'idem-' + Date.now() + '-' + Math.floor(Math.random() * 100000));
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Status code is 201', function () { pm.response.to.have.status(201); });
      const json = pm.response.json();
      if (json.data && json.data._id) pm.collectionVariables.set('wholesaleContractId', json.data._id);
    language: text/javascript
order: 4000
