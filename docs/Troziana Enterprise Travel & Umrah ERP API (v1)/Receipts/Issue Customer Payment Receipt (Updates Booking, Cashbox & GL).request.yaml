$kind: http-request
description: |-
  Collects payment for a booking or wholesale contract, updates cashbox balance, and posts double-entry journal (Dr Cashbox / Cr Deferred Customer Revenue)

  - **Required Permission:** `finance.receipts.create`
  - **Branch Scoped:** `true`
url: "{{baseUrl}}/api/v1/receipts"
method: POST
headers:
  - key: Accept
    value: application/json
  - key: x-branch-id
    value: "{{branchId}}"
    description: Active branch context override (validated against user's allowedBranchIds)
  - key: Content-Type
    value: application/json
  - key: Idempotency-Key
    value: "{{idempotencyKey}}"
    description: Optional idempotency key to prevent duplicate receipt posting
body:
  type: json
  content: |-
    {
      "bookingId": "{{bookingId}}",
      "cashboxId": "{{cashboxId}}",
      "amount": 58660,
      "exchangeRateToEgp": 1,
      "paymentMethod": "CASH",
      "notes": "Full Umrah package payment"
    }
auth:
  type: bearer
  credentials:
    token: "{{accessToken}}"
scripts:
  - type: beforeRequest
    code: |-
      // Auto-generate fresh Idempotency-Key for safe retry testing
      pm.collectionVariables.set('idempotencyKey', 'idem-' + Date.now() + '-' + Math.floor(Math.random() * 100000));
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Status code is 201', function () { pm.response.to.have.status(201); });
      const json = pm.response.json();
      if (json.data && json.data._id) pm.collectionVariables.set('receiptId', json.data._id);
    language: text/javascript
order: 2000
