$kind: http-request
name: Amend Hotel Contract (Room Capacities / Nights / Rates)
description: |-
  Amends an existing hotel contract, recalculates contractValue, and posts a delta adjustment to the supplier ledger

  - **Required Permission:** `hotels.update`
  - **Branch Scoped:** `false`
url: "{{baseUrl}}/api/v1/hotels/contracts/:id/amend"
method: PATCH
headers:
  - key: Accept
    value: application/json
  - key: x-branch-id
    value: "{{branchId}}"
    description: Active branch context override (validated against user's allowedBranchIds)
  - key: Content-Type
    value: application/json
pathVariables:
  - key: id
    value: "{{resourceId}}"
    description: HotelContract ObjectId
body:
  type: json
  content: |-
    {
      "reason": "Added 2 extra Quad rooms",
      "roomCapacities": {
        "doubleRooms": 2,
        "tripleRooms": 2,
        "quadRooms": 10
      },
      "exchangeRateToEgp": 13.5
    }
auth:
  type: bearer
  credentials:
    token: "{{accessToken}}"
scripts:
  - type: beforeRequest
    code: |-
      // Auto-generate fresh Idempotency-Key for safe retry testing
      pm.collectionVariables.set('idempotencyKey', 'idem-' + Date.now() + '-' + Math.floor(Math.random() * 100000));
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Expected HTTP status 200", function () {
        pm.response.to.have.status(200);
      });
      pm.test("Response has standard JSON structure", function () {
        if (pm.response.headers.get("Content-Type") && pm.response.headers.get("Content-Type").includes("application/json")) {
          const body = pm.response.json();
          pm.expect(body).to.be.an("object");
          if (body.success !== undefined) pm.expect(body.success).to.equal(true);
        }
      });
    language: text/javascript
order: 5000
