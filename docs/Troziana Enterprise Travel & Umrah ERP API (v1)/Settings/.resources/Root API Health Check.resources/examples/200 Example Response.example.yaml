$kind: http-example
request:
  url: "{{baseUrl}}/"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: x-branch-id
      value: "{{branchId}}"
      description: Active branch context override (validated against user's allowedBranchIds)
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": true,
        "message": "Troziana Enterprise Travel ERP API is running",
        "docs": "/api/v1/docs"
      }
order: 1000
