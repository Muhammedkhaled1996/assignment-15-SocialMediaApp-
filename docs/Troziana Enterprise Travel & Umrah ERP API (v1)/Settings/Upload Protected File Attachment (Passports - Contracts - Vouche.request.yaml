$kind: http-request
name: Upload Protected File Attachment (Passports / Contracts / Vouchers)
description: |-
  Uploads a file via multipart/form-data field 'file' and records metadata in FileAttachmentModel

  - **Required Permission:** `Authenticated / Public`
  - **Branch Scoped:** `true`
url: "{{baseUrl}}/api/v1/settings/attachments"
method: POST
headers:
  - key: Accept
    value: application/json
  - key: x-branch-id
    value: "{{branchId}}"
    description: Active branch context override (validated against user's allowedBranchIds)
body:
  type: formdata
  content:
    - type: file
      key: file
      src: []
    - type: text
      key: relatedEntityType
      value: Passenger
    - type: text
      key: relatedEntityId
      value: "{{passengerId}}"
auth:
  type: bearer
  credentials:
    token: "{{accessToken}}"
scripts:
  - type: beforeRequest
    code: |-
      // Auto-generate fresh Idempotency-Key for safe retry testing
      pm.collectionVariables.set('idempotencyKey', 'idem-' + Date.now() + '-' + Math.floor(Math.random() * 100000));
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Expected HTTP status 201", function () {
        pm.response.to.have.status(201);
      });
      pm.test("Response has standard JSON structure", function () {
        if (pm.response.headers.get("Content-Type") && pm.response.headers.get("Content-Type").includes("application/json")) {
          const body = pm.response.json();
          pm.expect(body).to.be.an("object");
          if (body.success !== undefined) pm.expect(body.success).to.equal(true);
        }
      });
    language: text/javascript
order: 6000
