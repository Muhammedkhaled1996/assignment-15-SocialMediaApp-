$kind: http-request
name: Get Trip Profitability Report (Forecast vs Operational vs Accounting Profit)
description: |-
  Returns trip profitability separating Forecast Profit, Operational Actual Profit, and Recognized Accounting Profit

  - **Required Permission:** `reports.read`
  - **Branch Scoped:** `false`
url: "{{baseUrl}}/api/v1/reports/trip-profitability"
method: GET
headers:
  - key: Accept
    value: application/json
  - key: x-branch-id
    value: "{{branchId}}"
    description: Active branch context override (validated against user's allowedBranchIds)
queryParams:
  - key: tripId
    value: ""
    disabled: true
    description: ""
  - key: season
    value: ""
    disabled: true
    description: ""
auth:
  type: bearer
  credentials:
    token: "{{accessToken}}"
scripts:
  - type: beforeRequest
    code: |-
      // Auto-generate fresh Idempotency-Key for safe retry testing
      pm.collectionVariables.set('idempotencyKey', 'idem-' + Date.now() + '-' + Math.floor(Math.random() * 100000));
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Expected HTTP status 200", function () {
        pm.response.to.have.status(200);
      });
      pm.test("Response has standard JSON structure", function () {
        if (pm.response.headers.get("Content-Type") && pm.response.headers.get("Content-Type").includes("application/json")) {
          const body = pm.response.json();
          pm.expect(body).to.be.an("object");
          if (body.success !== undefined) pm.expect(body.success).to.equal(true);
        }
      });
    language: text/javascript
order: 1000
