$kind: http-request
description: |-
  Creates a new company branch (e.g. Alexandria, Tanta, Assiut)

  - **Required Permission:** `branches.manage`
  - **Branch Scoped:** `false`
url: "{{baseUrl}}/api/v1/branches"
method: POST
headers:
  - key: Accept
    value: application/json
  - key: x-branch-id
    value: "{{branchId}}"
    description: Active branch context override (validated against user's allowedBranchIds)
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "code": "BR-ALX",
      "nameAr": "فرع الإسكندرية",
      "nameEn": "Alexandria Branch",
      "governorate": "Alexandria",
      "city": "Alexandria",
      "address": "45 Corniche El Nil, Smouha",
      "phone": "034255667",
      "email": "alex@troziana.com",
      "isHeadquarters": false,
      "status": "ACTIVE"
    }
auth:
  type: bearer
  credentials:
    token: "{{accessToken}}"
scripts:
  - type: beforeRequest
    code: |-
      // Auto-generate fresh Idempotency-Key for safe retry testing
      pm.collectionVariables.set('idempotencyKey', 'idem-' + Date.now() + '-' + Math.floor(Math.random() * 100000));
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Status code is 201', function () { pm.response.to.have.status(201); });
      const json = pm.response.json();
      if (json.data && json.data._id) pm.collectionVariables.set('secondaryBranchId', json.data._id);
    language: text/javascript
order: 3000
