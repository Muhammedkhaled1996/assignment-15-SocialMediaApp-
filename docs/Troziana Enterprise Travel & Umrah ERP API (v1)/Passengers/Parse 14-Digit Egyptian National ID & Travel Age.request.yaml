$kind: http-request
description: |-
  Extracts dateOfBirth, gender, governorate, and classifies ADULT / CHILD / INFANT age on travelDate

  - **Required Permission:** `passengers.read`
  - **Branch Scoped:** `false`
url: "{{baseUrl}}/api/v1/passengers/parse-national-id"
method: POST
headers:
  - key: Accept
    value: application/json
  - key: x-branch-id
    value: "{{branchId}}"
    description: Active branch context override (validated against user's allowedBranchIds)
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "nationalId": "29005150101234",
      "travelDate": "2027-01-10"
    }
auth:
  type: bearer
  credentials:
    token: "{{accessToken}}"
scripts:
  - type: beforeRequest
    code: |-
      // Auto-generate fresh Idempotency-Key for safe retry testing
      pm.collectionVariables.set('idempotencyKey', 'idem-' + Date.now() + '-' + Math.floor(Math.random() * 100000));
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Expected HTTP status 200", function () {
        pm.response.to.have.status(200);
      });
      pm.test("Response has standard JSON structure", function () {
        if (pm.response.headers.get("Content-Type") && pm.response.headers.get("Content-Type").includes("application/json")) {
          const body = pm.response.json();
          pm.expect(body).to.be.an("object");
          if (body.success !== undefined) pm.expect(body.success).to.equal(true);
        }
      });
    language: text/javascript
examples: ./.resources/Parse 14-Digit Egyptian National ID & Travel Age.resources/examples
order: 1000
