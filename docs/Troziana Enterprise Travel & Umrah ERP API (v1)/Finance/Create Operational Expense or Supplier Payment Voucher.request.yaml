$kind: http-request
description: |-
  Disburses funds from a cashbox, updates supplier ledger (if SUPPLIER_PAYMENT), and posts double-entry journal

  - **Required Permission:** `finance.expenses.create`
  - **Branch Scoped:** `true`
url: "{{baseUrl}}/api/v1/expenses"
method: POST
headers:
  - key: Accept
    value: application/json
  - key: x-branch-id
    value: "{{branchId}}"
    description: Active branch context override (validated against user's allowedBranchIds)
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "voucherType": "OPERATIONAL_EXPENSE",
      "branchId": "{{branchId}}",
      "cashboxId": "{{cashboxId}}",
      "tripId": "{{tripId}}",
      "category": "Pilgrim Bags & Gifts",
      "amount": 3500,
      "exchangeRateToEgp": 1,
      "paymentMethod": "CASH",
      "description": "Purchase of branded travel bags and Zamzam covers for Group A"
    }
auth:
  type: bearer
  credentials:
    token: "{{accessToken}}"
scripts:
  - type: beforeRequest
    code: |-
      // Auto-generate fresh Idempotency-Key for safe retry testing
      pm.collectionVariables.set('idempotencyKey', 'idem-' + Date.now() + '-' + Math.floor(Math.random() * 100000));
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Expected HTTP status 201", function () {
        pm.response.to.have.status(201);
      });
      pm.test("Response has standard JSON structure", function () {
        if (pm.response.headers.get("Content-Type") && pm.response.headers.get("Content-Type").includes("application/json")) {
          const body = pm.response.json();
          pm.expect(body).to.be.an("object");
          if (body.success !== undefined) pm.expect(body.success).to.equal(true);
        }
      });
    language: text/javascript
order: 2000
